{% load media_tags %}
{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
  <a class="btn btn-small" href="{% qs page=1 %}" aria-label="First page">&laquo; First</a>
  <a class="btn btn-small" href="{% qs page=page_obj.previous_page_number %}" rel="prev">&lsaquo; Previous</a>
  {% endif %}
  <span class="pagination-status">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a class="btn btn-small" href="{% qs page=page_obj.next_page_number %}" rel="next">Next &rsaquo;</a>
  <a class="btn btn-small" href="{% qs page=page_obj.paginator.num_pages %}" aria-label="Last page">Last &raquo;</a>
  {% endif %}
</nav>
{% endif %}
