{% extends "media_library/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="container auth-wrap">
  <div class="auth-card">
    <h1>Change password</h1>
    <form method="post" class="form" data-loading-text="Saving…" novalidate>
      {% csrf_token %}
      {% include "media_library/_form_fields.html" %}
      <button type="submit" class="btn btn-primary btn-block">Update password</button>
    </form>
    <p class="small"><a href="{% url 'media_library:profile' %}">&larr; Back to profile</a></p>
  </div>
</section>
{% endblock %}
