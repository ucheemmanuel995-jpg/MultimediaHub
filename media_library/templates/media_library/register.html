{% extends "media_library/base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="container auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="muted">Upload media, save favorites and join the conversation.</p>
    <form method="post" class="form" data-loading-text="Creating account…" novalidate>
      {% csrf_token %}
      {% include "media_library/_form_fields.html" %}
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p class="muted small">Already registered? <a href="{% url 'media_library:login' %}">Log in</a>.</p>
  </div>
</section>
{% endblock %}
