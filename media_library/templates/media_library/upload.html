{% extends "media_library/base.html" %}
{% block title %}Upload media{% endblock %}
{% block content %}
<section class="page-header">
  <div class="container">
    <h1>Upload media</h1>
    <p class="lead muted">Share an image, video or audio file. Private items are only visible to you.</p>
  </div>
</section>
<section class="container section-tight form-page">
  <form method="post" enctype="multipart/form-data" class="form panel" data-loading-text="Uploading…" novalidate>
    {% csrf_token %}
    {% include "media_library/_form_fields.html" %}
    <div id="file-preview" class="file-preview" aria-live="polite"></div>
    <div id="thumb-preview" class="file-preview" aria-live="polite"></div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Upload</button>
      <a class="btn" href="{% url 'media_library:my_media' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
